<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Booking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='editBooking.css') }}"> 
</head>
<body>
 <div id = "entry">
    <form method="POST">
        
        <input type="hidden" name="bookingID" value="{{ booking['bookingID'] }}">

        Credit Card Name: 
        <input type="text" id="ccname" name="Credit Card Name" value="{{ booking['creditCardName'] }}" required><br>

        Credit Card Number:
        <input type="text" id="ccnumber" name="Credit Card Number" value="{{ booking['creditCardNumber'] }}" required><br>

        CVV:
        <input type="text" id="cvv" name="CVV" value="{{ booking['creditCardCvv'] }}" required><br>

        Expiry:
        <input type="text" id="expiry" name="Expiry" value="{{ booking['creditCardExpiry'] }}" required><br>
        
        <button type="submit">Save Changes</button>
        <button onclick="location.href='/'">Back Home</button>
    </form>
    </div> 
</body>
</html>
