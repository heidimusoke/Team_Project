<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Booking</title>
</head>
<body>

    <h2>Edit Booking {{ booking['bookingID'] }}</h2>

    <form method="POST">


        <input type="hidden" name="bookingID" value="{{ booking['bookingID'] }}">

        Credit Card Name:
        <input type="text" name="Credit Card Name" value="{{ flight['Credit Card Name'] }}" required><br><br>

        Credit Card Number:
        <input type="text" name="Credit Card Number" value="{{ flight['Credit Card Number'] }}" required><br><br>

        CVV:
        <input type="text" name="CVV" value="{{ flight['CVV'] }}" required><br><br>
        
        <button type="submit">Save Changes</button>
    </form>

    <br>
    <button onclick="location.href='/'">Back Home</button>

</body>
</html>
