<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Booking System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='airplane.css') }}">
</head>

<body id="homeBody">

    <div class="topBar">
        <h1>
            TQHP Bookings</h1>
            <img id="logo" src="{{ url_for('static', filename='Images/sunset logo.png') }}">
    </div>

    <div class="main">
        <div id="loginSection">
            <div id="loginInput">

                    <form action="/adminLogin" method="POST">

                        <label>Email</label>
                        <input id="username" name="username" type="text" required>
                        <br>
                        <br>
                        <label>Password</label>
                        <input id="password" name="password" type="password" required>
                        <br>
                        <br>
                        <button id="login" type="submit">Login</button>

                    </form>

            </div>
        </div>
    </div>



</body>
</html>
