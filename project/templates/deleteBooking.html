<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Booking</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='deleteBooking.css') }}">
</head>

<body>

    <div id="top">
        <h1>TQHP Bookings</h1>
        <img id="logo" src="{{ url_for('static', filename='Images/sunset logo.png') }}">
    </div>

    <div class="container">
        <div class="card">
            <h2>Delete Booking</h2>

            <p>Are you sure you want to delete booking  
                <b>#{{ booking['bookingID'] }}</b>?</p>

            <form method="POST">
                <input type="hidden" name="bookingID" value="{{ booking['bookingID'] }}">
                <button type="submit" class="btn-danger">Yes, Delete Booking</button>
            </form>

            <button class="btn-secondary" onclick="location.href='/editBooking/{{ booking['bookingID'] }}'">
                No, Go Back
            </button>
        </div>
    </div>

    <div class="bottom">
        © 2026 TQHP Airlines
        <br>
        Contact | Help | Terms
    </div>

</body>
</html>
